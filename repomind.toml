# Configuration used when RepoMind analyzes itself.
#
# `tests/fixtures/sample_project` is intentionally broken: it exists to
# exercise every rule, so it must not count towards RepoMind's own health.
exclude = ["tests/fixtures"]

# Typer commands are declaration surfaces: one parameter per CLI flag with
# rich help text and no logic (they delegate to small helpers).
ignore = [
    "maintainability/too-many-parameters@src/repomind/cli/*.py",
    "maintainability/long-function@src/repomind/cli/*.py",
]
