name: RepoMind
description: Analyze a Python repository with RepoMind and upload the findings to GitHub code scanning.
author: RepoMind Contributors
branding:
  icon: activity
  color: purple

inputs:
  path:
    description: Repository path to analyze.
    required: false
    default: "."
  fail-under:
    description: Fail the workflow when the health score is below this value (0-100).
    required: false
    default: ""
  fail-on-new:
    description: Fail when findings are not accepted by the baseline file.
    required: false
    default: "false"
  baseline:
    description: Path to a baseline file (defaults to .repomind-baseline.json when present).
    required: false
    default: ""
  sarif-file:
    description: Where to write the SARIF report.
    required: false
    default: repomind.sarif
  upload-sarif:
    description: Upload the SARIF report to GitHub code scanning.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install RepoMind
      shell: bash
      run: python -m pip install --disable-pip-version-check "${{ github.action_path }}"

    - name: Analyze
      shell: bash
      env:
        REPOMIND_PATH: ${{ inputs.path }}
        REPOMIND_FAIL_UNDER: ${{ inputs.fail-under }}
        REPOMIND_FAIL_ON_NEW: ${{ inputs.fail-on-new }}
        REPOMIND_BASELINE: ${{ inputs.baseline }}
        REPOMIND_SARIF: ${{ inputs.sarif-file }}
      run: |
        set -euo pipefail
        args=(analyze "$REPOMIND_PATH" --format sarif --output "$REPOMIND_SARIF" --no-history)
        if [ -n "$REPOMIND_FAIL_UNDER" ]; then
          args+=(--fail-under "$REPOMIND_FAIL_UNDER")
        fi
        if [ "$REPOMIND_FAIL_ON_NEW" = "true" ]; then
          args+=(--fail-on-new)
        fi
        if [ -n "$REPOMIND_BASELINE" ]; then
          args+=(--baseline "$REPOMIND_BASELINE")
        fi
        repomind "${args[@]}"

    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: repomind
